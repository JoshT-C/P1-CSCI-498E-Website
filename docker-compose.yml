services:
  web:
    build: .
    container_name: jtc-site
    restart: unless-stopped
    # Non-root container listens on 8080/8443; only 80/443 are public.
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      # http-only until the certificate exists, then full (see RUNBOOK.md).
      NGINX_CONF: ${NGINX_CONF:-http-only}
      DOMAIN: ${DOMAIN:-jtc.lopyhupis.com}
    volumes:
      # The image ships both conf.d configs; this mount picks which one is
      # active by name — NGINX_CONF in .env selects it (http-only → full).
      - ./deploy/nginx/conf.d/${NGINX_CONF}.conf:/etc/nginx/conf.d/default.conf:ro
      # One named volume, read-only for web: nginx only reads the certs,
      # certbot writes them. No host paths into the container.
      - letsencrypt:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    read_only: true
    # nginx.conf keeps its pid and temp files on /tmp, the one writable path
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # One-shot certbot sidecar. Not "started" — invoked on demand:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot ...
  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["certbot"]

volumes:
  letsencrypt:
  certbot-webroot:
