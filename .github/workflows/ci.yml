# Verification on every push and pull request.
#
#   quality    lint, type-check, unit tests, build, bundle audit, dependency
#              audit, shellcheck; hands the build to the jobs below
#   e2e        the Playwright suite (with and without WebGL, desktop and
#              phone) on Linux (Chromium, Firefox, WebKit), macOS (WebKit:
#              Safari's engine) and Windows (Edge, Firefox). macOS runners
#              are slow enough that three engines there hit the job limit.
#   container  the Docker image as deployed: read-only, no capabilities,
#              non-root; the suite runs against its nginx, headers included
#   installer  the Proxmox helper end to end in a Debian 13 container
#              (deploy/proxmox/test/simulate.sh), then the suite against it
#
# Actions are pinned to commit SHAs (Dependabot keeps them current).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint (app, templates, e2e)
        run: npm run lint
      - name: Type-check (app, unit tests, e2e)
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Build
        run: npm run build
      - name: Bundle audit (secrets, http origins, sourcemaps)
        run: npm run audit:dist
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Shellcheck
        run: shellcheck deploy/proxmox/*.sh deploy/proxmox/test/*.sh deploy/proxmox/test/bin/* scripts/*.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/jtc-site/browser
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.os }})
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium,firefox,webkit
            install: --with-deps chromium firefox webkit
          - os: macos-latest
            browsers: webkit
            install: webkit
          - os: windows-latest
            browsers: edge,firefox
            install: firefox # Edge is on the runner already
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist/jtc-site/browser
      - run: npx playwright install ${{ matrix.install }}
      - name: Playwright (Linux, Firefox headed on Xvfb for software WebGL)
        if: runner.os == 'Linux'
        env:
          CI: 'true'
          E2E_BROWSERS: ${{ matrix.browsers }}
          E2E_XVFB: '1'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
      - name: Playwright
        if: runner.os != 'Linux'
        env:
          CI: 'true'
          E2E_BROWSERS: ${{ matrix.browsers }}
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report
          retention-days: 7

  container:
    name: Docker image behind its own nginx
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build the image
        run: docker build -t jtc-site:ci .
      - name: Run it as deployed (read-only, no capabilities, non-root)
        run: |
          docker run -d --name site -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            jtc-site:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          docker exec site nginx -t
          test "$(docker exec site id -u)" = 101
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Playwright against the container's nginx (headers checked)
        env:
          CI: 'true'
          E2E_BROWSERS: firefox
          E2E_XVFB: '1'
          E2E_NGINX: '1'
          E2E_BASE_URL: http://127.0.0.1:8080
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
      - if: failure()
        run: docker logs site
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-container
          path: playwright-report
          retention-days: 7

  installer:
    name: Proxmox installer (simulated LXC)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: jtc-site.sh → install.sh in a Debian 13 container
        run: |
          docker run -d --name pve-sim -p 8081:80 -v "$PWD:/src:ro" debian:trixie sleep infinity
          docker exec pve-sim bash /src/deploy/proxmox/test/simulate.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Playwright against the installed site (headers checked)
        env:
          CI: 'true'
          E2E_BROWSERS: firefox
          E2E_XVFB: '1'
          E2E_NGINX: '1'
          E2E_BASE_URL: http://127.0.0.1:8081
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
