# Weekly update PRs: npm dependencies, the SHA-pinned actions in CI, and
# the Docker base images. Major versions are left to deliberate upgrades:
# Angular pins its TypeScript and tooling ranges, and odd-numbered Node
# releases are not long-term support.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      playwright:
        patterns: ['playwright', '@playwright/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
