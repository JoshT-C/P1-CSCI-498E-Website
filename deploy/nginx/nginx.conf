# Non-root nginx main config for the container.
# - runs as uid 101 on a read-only filesystem; the pid and temp files go
#   to /tmp, a tmpfs
# - logs go to the container log stream: `docker logs jtc-site`
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;

    # temp files on /tmp, the one tmpfs a read-only container needs to write
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    tcp_nopush on;

    # nginx alpine ships without brotli; gzip only.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml;

    include /etc/nginx/snippets/jtc-http.conf;

    # The compose file mounts one of conf.d/{http-only,full}.conf here.
    include /etc/nginx/conf.d/default.conf;
}
