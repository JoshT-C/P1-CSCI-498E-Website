# Non-root nginx main config.
# - runs as the unprivileged `nginx` user (uid 101 in the image)
# - pid/cache/run all on tmpfs (the container filesystem is read-only)
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# The container filesystem is read-only, so logs go straight to the docker
# log stream: `docker logs jtc-site`.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # nginx alpine ships without brotli; gzip only. Honest, not clever.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff2;

    server_tokens off;

    # The site config is selected by the host environment: the compose file
    # mounts one of conf.d/{http-only,full}.conf as default.conf.
    include /etc/nginx/conf.d/default.conf;
}
