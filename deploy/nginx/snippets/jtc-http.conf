# http-level settings for the site. Included once in the http {} block:
# by nginx.conf in the container, and from /etc/nginx/conf.d/ in the LXC
# (Debian's nginx.conf includes conf.d/*.conf inside http {}).

# (server_tokens lives in jtc-site.conf, at server level: Debian's own
# nginx.conf already sets it in http {}, where a second one is an error)

# A static site reads nothing from a client but its request line: short
# timeouts and no request bodies, so slow or oversized requests cannot tie
# up workers.
client_max_body_size 1k;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
keepalive_timeout 15s;
large_client_header_buffers 4 8k;

# Per-client limits. Over the limit, the connection is closed with no
# response (444): an abusive client gets no bytes back, not even an error
# page. Generous enough for a page that loads ~15 files at once.
limit_req_zone  $binary_remote_addr zone=jtc_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=jtc_conn:10m;

# Cache policy by path, sent from one server-level add_header (see
# jtc-site.conf for why no location may use add_header). Hashed build
# output and fonts never change under a name; everything else, the page
# included, is revalidated so a deploy arrives at once.
map $uri $jtc_cache_control {
    ~^/media/                                 "public, max-age=31536000, immutable";
    "~-[A-Z0-9]{8}\.(?:js|css)$"              "public, max-age=31536000, immutable";
    default                                   "no-cache";
}
