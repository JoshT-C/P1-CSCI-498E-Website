# The site, inside a server {} block that has already set `root`.
#
# Every header is set here, at server level, and no location below uses
# add_header: in nginx a location with its own add_header drops ALL the
# add_header lines it would otherwise inherit, which is how the page used
# to go out with no CSP or HSTS at all.

index index.html;
charset utf-8;
server_tokens off;

limit_req  zone=jtc_req burst=400 nodelay;
limit_req_status 444;
limit_conn jtc_conn 100;
limit_conn_status 444;

# A static site answers GET (and HEAD) only.
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

add_header Cache-Control $jtc_cache_control always;

# HSTS: two years, subdomains included. Browsers ignore it over plain HTTP,
# so it is harmless on the HTTP-only and behind-a-proxy configs, and it is
# what the proxy passes on to visitors.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Content Security Policy, each source for a reason:
#   script-src   the bundle only; no inline script exists (incremental
#                hydration is off for this). 'wasm-unsafe-eval' lets the
#                room's mesh decoder compile its WebAssembly, and nothing
#                else: eval() stays blocked.
#   style-src    the stylesheet only; Angular and three.js set styles
#                through the CSSOM, which CSP does not restrict.
#   img-src      blob: for the room's textures, which three.js unpacks
#                from the model file into blob URLs; data: for canvases.
#   connect-src  blob: for the same textures (fetched, not <img>-loaded),
#                and the GitHub API for the repo list.
#   Trusted Types: Angular's own policies only, so no string can reach a
#                script sink.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: https://api.github.com; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler" always;

# Dotfiles (.git, .env, editor backups) are never served; the ACME
# challenge directory is the one exception, handled by the server file.
location ~ /\.(?!well-known/) {
    return 404;
}

# Build output and fonts: a missing file is a 404, never the page.
location ~* \.(?:js|css|woff2|glb|webp|png|ico|svg|json|txt)$ {
    try_files $uri =404;
}

# Everything else is the single-page app (deep links resolve here).
location / {
    try_files $uri $uri/ /index.html;
}
