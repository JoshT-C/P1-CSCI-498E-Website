# Post-certificate config.
#
# 8080 (host :80)  — redirects to https, except the ACME webroot, which
#                     stays up so certbot can renew without downtime.
# 8443 (host :443) — the site over TLS 1.2/1.3.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name jtc.lopyhupis.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Any other name on 443 (a scanner hitting the IP): close without a reply.
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name jtc.lopyhupis.com;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/certs/live/jtc.lopyhupis.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/jtc.lopyhupis.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/jtc-site.conf;
}
