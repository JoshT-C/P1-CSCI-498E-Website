# Post-cert config.
#
# 8080 (host :80)  — redirects everything to https, except the ACME webroot,
#                     which stays up so certbot can renew without downtime.
# 8443 (host :443) — the site: TLS 1.2/1.3, HSTS, security headers, CSP.

server {
    listen 8080;
    listen [::]:8080;
    server_name jtc.lopyhupis.com;

    # Renewals: let's-encrypt still probes the plain-HTTP webroot.
    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name jtc.lopyhupis.com;

    ssl_certificate     /etc/nginx/certs/live/jtc.lopyhupis.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/jtc.lopyhupis.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: six months, subdomains included. Only present here — the domain
    # must be fully HTTPS before this header is allowed to exist.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # This site runs no inline scripts (Angular injects <style> for lazy
    # components, hence the style-src exception). The GitHub API is the only
    # cross-origin fetch; avatars are the only cross-origin images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
