# First-boot config: plain HTTP on the container's 8080 (host maps 80→8080).
#
# Exists so the site is live and reachable BEFORE the certificate is issued,
# and so certbot's webroot challenge has somewhere to land. The moment the
# certificate exists, .env flips NGINX_CONF to full and this file retires —
# except for the ACME webroot, which full.conf keeps for renewals.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ACME HTTP-01 challenge: certbot writes the token file into the shared
    # webroot volume; we serve it straight out.
    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    # Hashed build assets: content-addressed, cache forever.
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell itself: never cache it, or deploys stop arriving.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: deep links and the single-page app both resolve here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
