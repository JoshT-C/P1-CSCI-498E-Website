# First-boot config: plain HTTP on the container's 8080 (host maps 80→8080).
#
# Live before the certificate exists, and gives certbot's webroot
# challenge somewhere to land. Once the certificate is issued, .env flips
# NGINX_CONF to full (see deploy/RUNBOOK.md).
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # ACME HTTP-01 challenge: certbot writes the token into the shared
    # webroot volume.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/jtc-site.conf;
}
