# The site in a Proxmox LXC, behind a TLS-terminating reverse proxy
# (NGINX Proxy Manager, Caddy, Cloudflare Tunnel). Installed by
# deploy/proxmox/install.sh as /etc/nginx/sites-available/jtc-site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/jtc-site;

    # The proxy is the client nginx sees. Take the visitor's address from
    # X-Forwarded-For, trusting it only from private networks (where the
    # proxy lives), so rate limits apply per visitor, not to the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log off;

    include /etc/nginx/snippets/jtc-site.conf;
}
